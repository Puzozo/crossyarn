name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /opt/crossyarn
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd /opt/crossyarn
          npm install

      - name: Generate Prisma client and push schema
        run: |
          cd /opt/crossyarn
          npx prisma generate
          npx prisma db push --skip-generate --accept-data-loss

      - name: Build
        run: |
          cd /opt/crossyarn
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || true

      - name: Restart app
        run: |
          cd /opt/crossyarn
          # Bind to loopback only: Caddy is the public entry (a 0.0.0.0 bind exposed :3000
          # directly, bypassing Caddy's /api/internal block and the XFF-based rate limits).
          pm2 restart crossyarn || HOSTNAME=127.0.0.1 pm2 start .next/standalone/server.js --name crossyarn
          # Recognition sidecar (python-service): restart only if it was set up on the
          # VPS; its venv/deps are installed manually (python-service/README.md).
          pm2 restart crossyarn-import 2>/dev/null || true
          pm2 save
